<html>
  <head>
    <title>Cadastro</title>
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="./cadastro.css" />
  </head>
  <body>
    <h1>Cadastro</h1>
    <div id="content">
      <form>
        <input id="name" type="text" placeholder="nome" />
        <input id="year" type="number" placeholder="ano" min="1900" />
        <input id="sells" type="number" placeholder="vendas" min="0" />
        <input id="protagonist" type="text" placeholder="protagonista" />
        <button>Cadastrar</button>
      </form>
    </div>
    <script src="./cadastro.js"></script>
  </body>
</html>
