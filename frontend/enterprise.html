  <body>
    <nav>

    <h1>Cadastro</h1>
    <div id="content">
      <form>
        <input id="name" type="text" placeholder="nome" />
        <input
          id="yearOfFundation"
          type="number"
          placeholder="ano de fundação"
          min="1900"
        />
        <button type="button" id="buttonSubmit">Cadastrar</button>
      </form>
    </div>
    <table id="tabela">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Ano de fundação</th>
        </tr>
      </thead>
      <tbody id="tablebody"></tbody>
    </table>
    <script src="./enterprise.js"></script>
  </body>
