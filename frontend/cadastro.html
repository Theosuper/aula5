<html>
  <head>
    <title>Cadastro</title>
    <link rel="stylesheet" href="./index.css" />
    <link rel="stylesheet" href="./cadastro.css" />
  </head>
  <body>
    <nav>
      <div>
        <a href="index.html">Logar</a>
      </div>
      <div>
        <a href="enterprise.html">Empresas</a>
      </div>
      <div>
        <a href="cadastro.html">Jogos</a>
      </div>
    </nav>
    <div id="aviso"></div>
    <h1>Cadastro</h1>
    <div id="content">
      <form>
        <input id="name" type="text" placeholder="nome" />
        <input id="year" type="number" placeholder="ano" min="1900" />
        <input id="sells" type="number" placeholder="vendas" min="0" />
        <input id="protagonist" type="text" placeholder="protagonista" />
        <select id="enterpriseId"></select>
        <button type="button" id="buttonSubmit">Cadastrar</button>
      </form>
    </div>
    <table id="tabela">
      <thead>
        <tr>
          <th>Indice</th>
          <th>Nome</th>
          <th>Vendas</th>
          <th>Protagonista</th>
          <th>Ano</th>
          <th>Empresa</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tablebody"></tbody>
    </table>
    <script src="./cadastro.js"></script>
  </body>
</html>
